<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>RoboMonkey</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0f0f13;
    color: #e2e2e8;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Header */
  .header {
    padding: 12px 16px;
    border-bottom: 1px solid #2a2a35;
    display: flex;
    align-items: center;
    gap: 10px;
    background: #16161e;
  }
  .header h1 { font-size: 16px; color: #ff6b35; letter-spacing: 0.5px; }
  .header .status {
    margin-left: auto;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 10px;
    background: #2a2a35;
    color: #888;
  }
  .header .status.connected { background: #1a3a1a; color: #4ade80; }
  .header .status.error { background: #3a1a1a; color: #f87171; }
  /* Nav */
  .nav {
    display: flex;
    gap: 2px;
    padding: 8px 12px;
    background: #16161e;
    border-bottom: 1px solid #2a2a35;
  }
  .nav button {
    flex: 1;
    padding: 8px;
    background: transparent;
    border: none;
    color: #888;
    cursor: pointer;
    border-radius: 6px;
    font-size: 12px;
    transition: 0.2s;
  }
  .nav button:hover { color: #fff; background: #2a2a35; }
  .nav button.active { color: #ff6b35; background: #2a1f18; font-weight: 600; }
  /* Content */
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  .screen { display: none; }
  .screen.active { display: block; }
  /* Chat */
  .chat-messages {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-bottom: 12px;
  }
  .msg {
    max-width: 92%;
    padding: 10px 12px;
    border-radius: 12px;
    font-size: 13px;
    line-height: 1.5;
    word-break: break-word;
  }
  .msg.user {
    align-self: flex-end;
    background: #2a1f18;
    border: 1px solid #3a2a1a;
    color: #e2e2e8;
  }
  .msg.assistant {
    align-self: flex-start;
    background: #1a1a24;
    border: 1px solid #2a2a35;
  }
  .msg .code-block {
    background: #0a0a10;
    border: 1px solid #2a2a35;
    border-radius: 8px;
    padding: 10px;
    margin: 8px 0;
    overflow-x: auto;
    font-family: 'Fira Code', 'Consolas', monospace;
    font-size: 11px;
    color: #a5b3ce;
    white-space: pre;
  }
  .msg .code-block .lang-label {
    display: block;
    color: #ff6b35;
    font-size: 10px;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .msg .actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .btn-sm {
    padding: 5px 10px;
    border: none;
    border-radius: 5px;
    font-size: 11px;
    cursor: pointer;
    transition: 0.2s;
  }
  .btn-primary { background: #ff6b35; color: #fff; }
  .btn-primary:hover { background: #e55a2b; }
  .btn-secondary { background: #2a2a35; color: #aaa; }
  .btn-secondary:hover { background: #3a3a45; color: #fff; }
  .chat-input-area {
    position: sticky;
    bottom: 0;
    background: #0f0f13;
    padding-top: 8px;
    border-top: 1px solid #2a2a35;
    display: flex;
    gap: 8px;
  }
  .chat-input-area textarea {
    flex: 1;
    background: #1a1a24;
    border: 1px solid #2a2a35;
    border-radius: 10px;
    padding: 10px;
    color: #e2e2e8;
    font-size: 13px;
    resize: none;
    min-height: 44px;
    max-height: 120px;
    font-family: inherit;
  }
  .chat-input-area textarea:focus { outline: none; border-color: #ff6b35; }
  .chat-input-area button {
    padding: 0 14px;
    background: #ff6b35;
    border: none;
    border-radius: 10px;
    color: #fff;
    cursor: pointer;
    font-weight: 600;
  }
  .chat-input-area button:hover { background: #e55a2b; }
  .chat-input-area button:disabled { opacity: 0.5; cursor: not-allowed; }
  .typing { font-size: 12px; color: #888; padding: 4px 0; font-style: italic; }
  /* Scripts list */
  .script-card {
    background: #16161e;
    border: 1px solid #2a2a35;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    transition: 0.2s;
  }
  .script-card:hover { border-color: #3a3a45; }
  .script-card .title {
    font-weight: 600;
    font-size: 13px;
    color: #e2e2e8;
    margin-bottom: 4px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .script-card .meta {
    font-size: 11px;
    color: #666;
    margin-bottom: 8px;
  }
  .script-card .match-tag {
    display: inline-block;
    background: #1a2a1a;
    color: #4ade80;
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 10px;
    margin-right: 4px;
  }
  .script-card .actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .toggle-switch {
    position: relative;
    width: 36px;
    height: 20px;
    background: #2a2a35;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.2s;
    flex-shrink: 0;
  }
  .toggle-switch.on { background: #ff6b35; }
  .toggle-switch::after {
    content: '';
    position: absolute;
    top: 2px;
    left: 2px;
    width: 16px;
    height: 16px;
    background: #fff;
    border-radius: 50%;
    transition: 0.2s;
  }
  .toggle-switch.on::after { left: 18px; }
  .empty-state {
    text-align: center;
    padding: 40px 20px;
    color: #555;
  }
  .empty-state .icon { font-size: 32px; margin-bottom: 10px; }
  /* Settings */
  .setting-group {
    background: #16161e;
    border: 1px solid #2a2a35;
    border-radius: 10px;
    padding: 14px;
    margin-bottom: 12px;
  }
  .setting-group label {
    display: block;
    font-size: 12px;
    color: #888;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .setting-group input, .setting-group select, .setting-group textarea {
    width: 100%;
    background: #0f0f13;
    border: 1px solid #2a2a35;
    border-radius: 8px;
    padding: 10px;
    color: #e2e2e8;
    font-size: 13px;
    font-family: inherit;
  }
  .setting-group input:focus, .setting-group select:focus, .setting-group textarea:focus {
    outline: none;
    border-color: #ff6b35;
  }
  .setting-group textarea { min-height: 80px; resize: vertical; }
  .setting-group .hint { font-size: 11px; color: #555; margin-top: 6px; }
  .btn-full {
    width: 100%;
    padding: 10px;
    background: #ff6b35;
    border: none;
    border-radius: 8px;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
  }
  .btn-full:hover { background: #e55a2b; }
  .btn-full.secondary { background: #2a2a35; }
  .btn-full.secondary:hover { background: #3a3a45; }
  /* Search */
  .search-box {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .search-box input {
    flex: 1;
    background: #16161e;
    border: 1px solid #2a2a35;
    border-radius: 8px;
    padding: 10px;
    color: #e2e2e8;
    font-size: 13px;
  }
  .search-box input:focus { outline: none; border-color: #ff6b35; }
  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a35; border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: #3a3a45; }
</style>
</head>
<body>

<div class="header">
  <h1>🐵 RoboMonkey</h1>
  <span class="status" id="statusIndicator">● Checking...</span>
</div>

<div class="nav">
  <button class="active" data-screen="chat">🤖 Chat</button>
  <button data-screen="scripts">📜 Scripts</button>
  <button data-screen="greasy">🌐 GreasyFork</button>
  <button data-screen="settings">⚙️ Settings</button>
</div>

<div class="content">

  <!-- CHAT SCREEN -->
  <div class="screen active" id="screen-chat">
    <div class="chat-messages" id="chatMessages">
      <div class="msg assistant">
        <strong>RoboMonkey AI</strong><br>
        Describe what userscript you want. For example: <em>"Hide ads on YouTube"</em> or <em>"Add a dark mode button to Reddit"</em>.
      </div>
    </div>
    <div class="typing" id="typingIndicator" style="display:none">AI is thinking...</div>
    <div class="chat-input-area">
      <textarea id="chatInput" placeholder="Describe the script you want..." rows="2"></textarea>
      <button id="sendBtn">➤</button>
    </div>
  </div>

  <!-- SCRIPTS SCREEN -->
  <div class="screen" id="screen-scripts">
    <div style="display:flex;gap:8px;margin-bottom:12px;">
      <button class="btn-full" onclick="createNewScript()">+ Create Script</button>
      <button class="btn-full secondary" onclick="importScript()">📥 Import</button>
    </div>
    <div class="search-box">
      <input type="text" id="scriptFilter" placeholder="Filter scripts..." oninput="renderScripts()">
    </div>
    <div id="scriptsList"></div>
  </div>

  <!-- GREASYFORK SCREEN -->
  <div class="screen" id="screen-greasy">
    <div class="search-box">
      <input type="text" id="gfSearch" placeholder="Search GreasyFork...">
      <button class="btn-sm btn-primary" onclick="searchGreasyFork()">Search</button>
    </div>
    <div id="gfResults"></div>
  </div>

  <!-- SETTINGS SCREEN -->
  <div class="screen" id="screen-settings">
    <div class="setting-group">
      <label>OpenRouter API Key</label>
      <input type="password" id="apiKey" placeholder="sk-or-v1-...">
      <div class="hint">Get key at openrouter.ai/keys</div>
    </div>
    <div class="setting-group">
      <label>AI Model</label>
      <select id="modelSelect">
        <option value="openai/gpt-4o-mini">openai/gpt-4o-mini</option>
        <option value="anthropic/claude-3-haiku">anthropic/claude-3-haiku</option>
        <option value="google/gemini-flash-1.5">google/gemini-flash-1.5</option>
        <option value="meta-llama/llama-3.1-8b-instruct">meta-llama/llama-3.1-8b-instruct</option>
      </select>
      <button class="btn-full secondary" style="margin-top:8px" onclick="loadModels()">🔄 Load All Models from OpenRouter</button>
      <label style="margin-top:10px;"><input type="checkbox" id="freeOnly"> Show free models only</label>
    </div>
    <div class="setting-group">
      <label>System Prompt</label>
      <textarea id="systemPrompt">You are an expert userscript developer for Tampermonkey/Greasemonkey. Generate working JavaScript code with proper metadata block (// ==UserScript== with @name, @match, @grant). Use GM_* APIs when needed. Return only the script inside a code block.</textarea>
    </div>
    <div class="setting-group">
      <label>Temperature</label>
      <input type="range" id="temperature" min="0" max="15" value="7" style="width:100%">
      <div class="hint" id="tempValue">0.7</div>
    </div>
    <button class="btn-full" onclick="saveSettings()">💾 Save Settings</button>
  </div>

</div>

<script src="sidepanel.js"></script>
</body>
</html>
