<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #fdf6f0 0%, #f5ebe0 50%, #f0e6dd 100%);
            overflow: hidden;
            position: relative;
        }

        /* Soft floating blobs — reference: Soft Services hero */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .blob-1 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, #e8d5c4 0%, transparent 70%);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .blob-2 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, #d4c4b0 0%, transparent 70%);
            bottom: -50px;
            right: -50px;
            animation-delay: -7s;
        }

        .blob-3 {
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, #c9b8a5 0%, transparent 70%);
            top: 50%;
            left: 60%;
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.05); }
            66% { transform: translate(-20px, 20px) scale(0.95); }
        }

        .card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
            padding: 80px 100px;
            box-shadow:
                0 4px 6px -1px rgba(0, 0, 0, 0.02),
                0 20px 40px -10px rgba(0, 0, 0, 0.06),
                inset 0 1px 0 rgba(255, 255, 255, 0.6);
            text-align: center;
            max-width: 600px;
            animation: slideUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .eyebrow {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: #a08070;
            margin-bottom: 24px;
            animation: fadeIn 1s ease 0.3s forwards;
            opacity: 0;
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        h1 {
            font-size: clamp(48px, 8vw, 88px);
            font-weight: 800;
            line-height: 1.05;
            color: #2a2520;
            letter-spacing: -0.03em;
            margin-bottom: 20px;
            animation: fadeIn 1s ease 0.5s forwards;
            opacity: 0;
        }

        h1 span {
            display: block;
            font-weight: 300;
            font-size: 0.55em;
            letter-spacing: 0.02em;
            color: #8a7a6e;
            margin-top: 8px;
        }

        .divider {
            width: 48px;
            height: 2px;
            background: linear-gradient(90deg, #c9a78a, #a08070);
            border-radius: 2px;
            margin: 32px auto;
            animation: fadeIn 1s ease 0.7s forwards, scaleX 0.8s ease 0.7s forwards;
            opacity: 0;
            transform: scaleX(0);
        }

        @keyframes scaleX {
            to { transform: scaleX(1); }
        }

        .subtitle {
            font-size: 16px;
            font-weight: 400;
            color: #9a8a7e;
            line-height: 1.6;
            max-width: 360px;
            margin: 0 auto;
            animation: fadeIn 1s ease 0.9s forwards;
            opacity: 0;
        }

        .tag {
            display: inline-block;
            margin-top: 40px;
            padding: 8px 20px;
            background: rgba(201, 167, 138, 0.15);
            border: 1px solid rgba(201, 167, 138, 0.3);
            border-radius: 100px;
            font-size: 12px;
            font-weight: 500;
            color: #a08070;
            letter-spacing: 0.02em;
            animation: fadeIn 1s ease 1.1s forwards;
            opacity: 0;
        }

        /* Responsive */
        @media (max-width: 640px) {
            .card {
                padding: 48px 32px;
                margin: 20px;
                border-radius: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <div class="card">
        <div class="eyebrow">First Contact</div>
        <h1>
            Hello<br>World
            <span>Nice to meet you</span>
        </h1>
        <div class="divider"></div>
        <p class="subtitle">
            A quiet page for a loud moment. Soft tones, clean type, and a little warmth.
        </p>
        <div class="tag">Made with care</div>
    </div>
</body>
</html>
